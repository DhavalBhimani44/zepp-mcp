name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The test suite never touches the network: it runs entirely against the
# committed fixture corpus. No secrets are needed, so pull requests from
# forks run the full suite.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -v

      - name: Verify the MCP server starts and lists its tools
        run: uv run python tools/smoke_test.py

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Assert no personal data in the fixture corpus
        run: uv run tools/check_fixtures.py
